{% extends "base.html" %}

{% block title %}Log in{% endblock %}

{% block content %}
<section class="auth-layout">
  <div class="auth-intro">
    <span class="eyebrow">WELCOME BACK</span>

    <h1>Pick up where you left off.</h1>

    <p>
      Review your courses, quiz scores, and recommendations.
    </p>
  </div>

  <form
    class="panel auth-form"
    method="post"
    action="{{ url_for('login') }}"
  >
    <input
      type="hidden"
      name="csrf_token"
      value="{{ csrf_token() }}"
    >

    <h2>Log in</h2>
    <p class="muted">Enter your account details.</p>

    <label for="login-email">
      Email address
      <input
        id="login-email"
        type="email"
        name="email"
        value="{{ request.form.get('email', '') }}"
        maxlength="150"
        autocomplete="email"
        required
      >
    </label>

    <label for="login-password">
      Password
      <input
        id="login-password"
        type="password"
        name="password"
        autocomplete="current-password"
        required
      >
    </label>

    <button class="btn primary full" type="submit">
      Log in
    </button>

    <p class="form-foot">
      New here?
      <a href="{{ url_for('register') }}">Create an account</a>
    </p>
  </form>
</section>
{% endblock %}
