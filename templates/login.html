{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<section class="auth-layout"><div class="auth-intro"><span class="eyebrow">WELCOME BACK</span><h1>Pick up where you left off.</h1><p>Your learning path is waiting for you.</p></div><form class="panel auth-form" method="post"><h2>Log in</h2><p class="muted">Enter your account details.</p><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><button class="btn primary full" type="submit">Log in</button><p class="form-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p></form></section>
{% endblock %}
