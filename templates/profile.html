{% extends "base.html" %}
{% block title %}Your profile{% endblock %}
{% block content %}
<section class="page-heading"><div><span class="eyebrow">YOUR PROFILE</span><h1>Learning preferences</h1><p>Keep your interests and skills up to date to improve recommendations.</p></div></section>
<form class="panel profile-form" method="post"><label>Full name<input name="name" value="{{ current_user.name }}" required></label><label>Email address<input value="{{ current_user.email }}" disabled></label><label>Interests <span class="muted small">(comma-separated)</span><textarea name="interests" rows="3">{{ current_user.interests or '' }}</textarea></label><label>Current skills <span class="muted small">(comma-separated)</span><textarea name="skills" rows="3">{{ current_user.skills or '' }}</textarea></label><button class="btn primary" type="submit">Save preferences</button></form>
{% endblock %}
